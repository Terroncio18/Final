# What SonarQube Cloud analyses, and with which coverage.
#
# The scanner is run by hand from this directory, with the token in the
# environment and never here:
#
#   $env:SONAR_TOKEN = "<the token>"; npx -y sonarqube-scanner
#
# The project's analysis method has to be the one driven from outside (CI
# based): a project with Automatic Analysis on refuses the runs made from here.

# The two keys the site shows once the GitHub repository is imported.
sonar.projectKey=Terroncio18_Final
sonar.organization=terroncio18
sonar.projectName=IgnisLab
sonar.projectVersion=0.1.0
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Ours is the source of the two halves, the web app and the API. The prepared
# data, the fonts, the builds and the reports are not.
sonar.sources=web/src,api/src
sonar.exclusions=**/*.spec.ts,**/*.test.mjs,web/public/data/**,web/src/fonts/**,web/coverage/**,api/data/**,**/dist/**,**/node_modules/**

# The tests are declared apart, so that they are measured as tests and not as
# code to be judged.
sonar.tests=web/src,api/tests
sonar.test.inclusions=web/src/**/*.spec.ts,api/tests/**/*.test.mjs

# The TypeScript rules that need types need the configuration that declares
# them.
sonar.typescript.tsconfigPaths=web/tsconfig.json,api/tsconfig.json

# The coverage of the two web runs, written by `npm run test:coverage` with
# paths that start at this directory. The API's is left out on purpose: Node
# measures `dist/`, the compiled JavaScript, which is not in the repository.
sonar.javascript.lcov.reportPaths=web/coverage/model/lcov.info,web/coverage/web/lcov.info
