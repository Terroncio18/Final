<div class="picker" tabindex="-1" (focusout)="leave($event)" (keydown)="key($event)">
  <button
    type="button"
    class="trigger"
    [class.busy]="loading()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    (click)="toggle()"
  >
    <span class="when">{{ label() }}</span>
    @if (loading()) {
      <small class="state">carregant…</small>
    } @else if (missingKey()) {
      <small class="state warn">falta la clau FIRMS</small>
    } @else if (failed()) {
      <small class="state warn">sense resposta</small>
    } @else {
      <small class="state">{{ count() }} {{ count() === 1 ? 'detecció' : 'deteccions' }}</small>
    }
  </button>

  @if (open()) {
    <div class="panel" role="dialog" aria-label="Dates de les deteccions">
      @if (failed()) {
        <p class="note warn">No s'han pogut llegir les deteccions.</p>
        <button type="button" class="apply" (click)="retry()">Tornar-ho a provar</button>
      }

      <p class="head">Darrers dies</p>
      <div class="presets">
        @for (days of presets; track days) {
          <button
            type="button"
            class="preset"
            [class.on]="current() === days"
            (click)="choosePreset(days)"
          >
            {{ days === 1 ? 'Avui' : days + ' dies' }}
          </button>
        }
      </div>

      <p class="head">Dates concretes</p>
      <div class="dates">
        <label>
          <span>Des de</span>
          <input
            type="date"
            [value]="from()"
            [attr.min]="earliest()"
            [max]="today"
            (input)="edit('from', $event)"
          />
        </label>
        <label>
          <span>Fins a</span>
          <input
            type="date"
            [value]="to()"
            [attr.min]="earliest()"
            [max]="today"
            (input)="edit('to', $event)"
          />
        </label>
      </div>

      @if (problem(); as why) {
        <p class="note warn">{{ why }}</p>
      } @else {
        <p class="note">Com a molt {{ maxDays }} dies de cop.</p>
      }

      <button type="button" class="apply" [disabled]="!!problem()" (click)="apply()">
        Veure aquestes dates
      </button>
    </div>
  }
</div>
