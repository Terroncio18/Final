<div class="map-view">
  <div #container class="map-canvas" role="application" aria-label="Mapa"></div>

  <div class="map-loading" [class.is-hidden]="ready()" role="status" aria-live="polite">
    <span class="map-loading-ring" aria-hidden="true"></span>
    <p>Carregant el mapa…</p>
    <small>Imatgeria d'Esri · relleu de Mapzen</small>
  </div>

  @if (selected(); as hotspot) {
    <app-hotspot-panel [hotspot]="hotspot" (closed)="clearSelection()" />
  }
</div>
